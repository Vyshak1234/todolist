            "Comment": "Add/Update record for PR preview",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${APP_DOMAIN}",
                "Type": "CNAME",
                "TTL": 60,
                "ResourceRecords": [{ "Value": "${LB_HOSTNAME}" }]
              }
            }]
          }
          EOF

          aws route53 change-resource-record-sets \
            --hosted-zone-id $HOSTEDZONE_ID \
            --change-batch file://change-batch.json

      - name: URL Updation for Admin Panel.
        run: |
         EXTERNAL_API_ENDPOINT="http://acceleratorapp-alpha-${ENV_NUM}.alpha-monolith-${ENV_NUM}.svc.cluster.local/api/admin-panel"
         echo "EXTERNAL_API_ENDPOINT=$EXTERNAL_API_ENDPOINT" >> $GITHUB_ENV

      - name: URL Updation for calendar private
        run: |
          DB_HOST="postgres"
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

          DELIVERY_ADDRESS="https://calender-alpha-${ENV_NUM}.alpha.gh.acceleratorapp.co"
          echo "DELIVERY_ADDRESS=$DELIVERY_ADDRESS" >> $GITHUB_ENV

          CALENDAR_SECRET="calendar-common-alpha-${ENV_NUM}"
          echo "CALENDAR_SECRET=$CALENDAR_SECRET" >> $GITHUB_ENV

      - name: Create Application for admin_panel
        run: |
          echo "$ADMIN_PANEL_APPLICATION" > admin_panel_application.yaml

          yq -i '.metadata.annotations["argocd-image-updater.argoproj.io/aawebsite.allow-tags"] = "regexp:^stg-[0-9a-zA-Z]+$"' admin_panel_application.yaml

          yq -i ".metadata.name = \"admin-panel-alpha-${ENV_NUM}\"" admin_panel_application.yaml

          yq -i ".spec.destination.namespace = \"alpha-monolith-${ENV_NUM}\"" admin_panel_application.yaml

          yq -i ".spec.source.helm.releaseName = \"admin-panel-alpha-${ENV_NUM}\"" admin_panel_application.yaml

          yq -i '.spec.source.helm.parameters += [{"name": "configMap.data.EXTERNAL_API_ENDPOINT", "value": strenv(EXTERNAL_API_ENDPOINT)}]' admin_panel_application.yaml

          yq -i '.spec.source.helm.parameters += [{"name": "image.tag", "value": strenv(ADMIN_PANEL_STG_TAG)}]' admin_panel_application.yaml

          yq -i '.spec.source.helm.parameters += [{"name": "ingress.rules[0].host", "value": strenv(ADMIN_PANEL_DOMAIN)}]' admin_panel_application.yaml

          echo "=== Final admin_panel_application.yaml ==="
