              }
            }]
          }
          EOF

          aws route53 change-resource-record-sets \
            --hosted-zone-id $HOSTEDZONE_ID \
            --change-batch file://change-batch.json

      - name: URL Updation for Acceleratorapp.
        run: |
          USER_INTEGRATION_URL="http://users-private-alpha-${ENV_NUM}.alpha-monolith-${ENV_NUM}.svc.cluster.local:9000/graphql"
          echo "USER_INTEGRATION_URL=$USER_INTEGRATION_URL" >> $GITHUB_ENV

          REDIS_URL="redis://revvly-api-dev-redis-master:6379"
          echo "REDIS_URL=$REDIS_URL" >> $GITHUB_ENV

          AVAILABILITY_INTEGRATION_URL="http://availability-private-alpha-${ENV_NUM}.alpha-monolith-${ENV_NUM}.svc.cluster.local:9001/graphql"
          echo "AVAILABILITY_INTEGRATION_URL=$AVAILABILITY_INTEGRATION_URL" >> $GITHUB_ENV

          CALENDAR_INTEGRATION_URL="http://calendar-private-alpha-${ENV_NUM}.alpha-monolith-${ENV_NUM}.svc.cluster.local:9002/graphql"
          echo "CALENDAR_INTEGRATION_URL=$CALENDAR_INTEGRATION_URL" >> $GITHUB_ENV

          APP_DOMAIN="alpha${ENV_NUM}.acceleratorapp.co"
          echo "APP_DOMAIN=$APP_DOMAIN" >> $GITHUB_ENV

          GOOGLE_REDIRECT_URI_DOMAIN="dev.api.alpha${ENV_NUM}.acceleratorapp.co"
          echo "GOOGLE_REDIRECT_URI_DOMAIN=$GOOGLE_REDIRECT_URI_DOMAIN" >> $GITHUB_ENV

      - name: Create Route53 Record for APP Domain
        run: |
          cat > change-batch.json <<EOF
