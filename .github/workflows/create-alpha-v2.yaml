          echo "Latest STG image tag: $LATEST_TAG"
          echo "USER_PRIVATE_STG_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Generate preview domain accelerator
        run: |
          ACCELERATORAPP_DOMAIN="api-${ENV_NUM}.alpha.gh.acceleratorapp.co"
          echo "ACCELERATORAPP_DOMAIN=$ACCELERATORAPP_DOMAIN" >> $GITHUB_ENV

          ACCELERATORAPP_INGRESS_DOMAIN="*.api-${ENV_NUM}.alpha.gh.acceleratorapp.co"
          echo "ACCELERATORAPP_INGRESS_DOMAIN=$ACCELERATORAPP_INGRESS_DOMAIN" >> $GITHUB_ENV

          ACCELERATORAPP_SECOND_INGRESS_DOMAIN="*.alpha.gh.acceleratorapp.co"
          echo "ACCELERATORAPP_SECOND_INGRESS_DOMAIN=$ACCELERATORAPP_SECOND_INGRESS_DOMAIN" >> $GITHUB_ENV

      - name: Generate preview domain calender
        run: |
          CALANDER_DOMAIN="calender-alpha-${ENV_NUM}.alpha.gh.acceleratorapp.co"
          echo "CALANDER_DOMAIN=$CALANDER_DOMAIN" >> $GITHUB_ENV

      - name: Generate preview domain admin-panel
        run: |
          ADMIN_PANEL_DOMAIN="api-${ENV_NUM}-admin.alpha.gh.acceleratorapp.co"
          echo "ADMIN_PANEL_DOMAIN=$ADMIN_PANEL_DOMAIN" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.GIT_ACTION_ROLE }}
          role-session-name: github-actions-oidc
          aws-region: ${{ env.REGION }}
          audience: sts.amazonaws.com

      - name: Configure AWS credentials (EKS access)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.GIT_ACTION_EKS_ROLE }}
          role-chaining: true
          role-session-name: github-actions-role-chaining
          aws-region: ${{ env.REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $REGION

      - name: Get LoadBalancer DNS
        id: get-lb
        run: |
          LB_HOSTNAME=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "LB_HOSTNAME=$LB_HOSTNAME" >> $GITHUB_ENV

      - name: Create Route53 Record for Acceleratorapp
        run: |
          cat > change-batch.json <<EOF
          {
            "Comment": "Add/Update record for PR preview",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${ACCELERATORAPP_DOMAIN}",
                "Type": "CNAME",
                "TTL": 60,
                "ResourceRecords": [{ "Value": "${LB_HOSTNAME}" }]
              }
            }]
          }
          EOF

          aws route53 change-resource-record-sets \
            --hosted-zone-id $HOSTEDZONE_ID \
            --change-batch file://change-batch.json
        
      - name: Create Route53 Record for Calender
        run: |
          cat > change-batch.json <<EOF
          {
            "Comment": "Add/Update record for PR preview",
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${CALANDER_DOMAIN}",
                "Type": "CNAME",
                "TTL": 60,
                "ResourceRecords": [{ "Value": "${LB_HOSTNAME}" }]
              }
            }]
          }
          EOF

          aws route53 change-resource-record-sets \
            --hosted-zone-id $HOSTEDZONE_ID \
            --change-batch file://change-batch.json

      - name: Create Route53 Record for Admin-Panel
        run: |
